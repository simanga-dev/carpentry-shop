# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore CarpentryShop.sln
    - name: Check format
      run: dotnet format CarpentryShop.sln --verify-no-changes --no-restore
    - name: Build
      run: dotnet build CarpentryShop.sln --no-restore --configuration Release

  deploy:
     needs: build
     runs-on: ubuntu-latest
     if: github.ref == 'refs/heads/master'
     permissions:
       contents: read
       packages: write
     steps:
     - name: Checkout code
       uses: actions/checkout@v7
     - name: Docker Login
       run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
     - name: Build
       run: docker build . -t ghcr.io/simanga-dev/carpentry-shop:latest
     - name: push
       run: docker push ghcr.io/simanga-dev/carpentry-shop:latest
